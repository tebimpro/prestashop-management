name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Only Markdown / JSON / YAML / PNG, no shebangs
        run: |
          bad=$(git ls-files | grep -vE '(\.md|\.json|\.ya?ml|\.png|^LICENSE|^\.gitignore)$' || true)
          [ -z "$bad" ] || { echo "Disallowed files:"; echo "$bad"; exit 1; }
          git ls-files | while IFS= read -r f; do
            if [ "$(head -c2 "$f")" = "#!" ]; then echo "starts with #!: $f"; exit 1; fi
          done
          echo "ok"
